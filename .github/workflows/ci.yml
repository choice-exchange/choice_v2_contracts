name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # PINNED, not `stable`. `forge fmt` output changes between Foundry releases, so an
      # unpinned toolchain turns this gate red overnight with no code change - it did, on
      # 1.8.1, the moment checkout started working (2026-09-05). The workspace calls local
      # `forge fmt --check` + `forge test --isolate` the real gate; that is only true while
      # CI runs the same version the dev box does. Bumping is a deliberate PR: change this
      # pin and commit the reformat together.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      # via_ir at 25,666 runs is slow; without this cache every PR pays it in full and the
      # org has overrun its Actions minutes before.
      - name: Cache forge build
        uses: actions/cache@v4
        with:
          path: |
            foundry-out
            cache
          key: forge-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', '.gitmodules') }}-${{ hashFiles('src/**', 'test/**', 'script/**') }}
          restore-keys: |
            forge-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', '.gitmodules') }}-

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build

      # EIP-170, checked on the contracts THIS repo deploys. Plain `forge build --sizes`
      # cannot be used: it fails on upstream's CLPositionManager, which infinity-periphery
      # compiles at 9,000 optimizer runs (a compilation_restrictions entry) precisely so it
      # fits, while this repo has one flat profile at 25,666 runs. That oversized artifact is
      # a byproduct nothing here deploys - periphery's own script 02 deploys it, under
      # periphery's profile.
      - name: Contract sizes
        run: |
          ours="$(find src -name '*.sol' \
                  -exec sed -n 's/^ *\(abstract \)\?contract \([A-Za-z0-9_]*\).*/\2/p' {} + \
                  | sort -u | jq -R . | jq -sc .)"
          # forge exits 1 - and prints "some contracts exceed the runtime size limit" - when
          # ANY artifact is over, upstream's included, so neither its exit code nor its stderr
          # is the signal here; both are dropped so a passing step does not read as an error.
          # The JSON is the signal, and the three guards below are what make dropping them
          # safe: no report, a missing contract, or a negative margin each fail the step.
          # `forge build` above is what catches a real compile error, before this ever runs.
          forge build --sizes --json > "$RUNNER_TEMP/sizes.json" 2>/dev/null || true
          jq -e 'type == "object" and length > 0' "$RUNNER_TEMP/sizes.json" > /dev/null \
            || { echo "::error::forge produced no size report"; exit 1; }
          # a renamed or deleted contract has to break this, not silently shrink the gate
          missing="$(jq -r --argjson ours "$ours" '$ours - keys | join(", ")' "$RUNNER_TEMP/sizes.json")"
          [ -z "$missing" ] || { echo "::error::not in the size report: $missing"; exit 1; }
          over="$(jq -r --argjson ours "$ours" '
            to_entries
            | map(select((.key as $k | $ours | index($k)) and .value.runtime_margin < 0))
            | map("\(.key) is \(-.value.runtime_margin) bytes over") | join("; ")' "$RUNNER_TEMP/sizes.json")"
          [ -z "$over" ] || { echo "::error::EIP-170: $over"; exit 1; }
          jq -r --argjson ours "$ours" 'to_entries | map(select(.key as $k | $ours | index($k)))
            | .[] | "  \(.key): \(.value.runtime_size) bytes, \(.value.runtime_margin) to spare"' \
            "$RUNNER_TEMP/sizes.json"

      - name: Test
        run: forge test --isolate -vvv
        env:
          FOUNDRY_PROFILE: ci

  address-book:
    name: Address book is well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # deployments/*.json is the single source of truth for every consumer - frontend,
      # backend, launchpad, sdk. A malformed or duplicated entry here ships a wrong address
      # everywhere at once, so it is checked before anything reads it.
      - name: Validate
        run: |
          fail=0
          for f in deployments/injective_*.json; do
            echo "checking $f"
            jq -e . "$f" > /dev/null || { echo "::error file=$f::not valid JSON"; fail=1; continue; }

            # Every 0x value must be exactly 20 bytes (an address) or 32 bytes (a poolId,
            # a salt, a PoolKey.parameters). Anything else - a truncated address, a value
            # pasted one nibble short - is caught here rather than by a consumer at runtime.
            bad="$(jq -r '[paths(scalars) as $p | {p: ($p | join(".")), v: getpath($p)}]
                          | map(select(.v != null and (.v | type) == "string" and (.v | startswith("0x"))))
                          | map(select(.v | test("^0x([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$") | not))
                          | map(.p) | .[]' "$f")"
            if [ -n "$bad" ]; then
              echo "::error file=$f::not a 20- or 32-byte 0x value: $bad"; fail=1
            fi

            # A single address must never appear under two different keys - that is almost
            # always a copy-paste that ships one contract's address as another's. The
            # exception is a deliberate alias, which must be listed in meta.addressAliases
            # with the reason, so an intentional overlap is a reviewed line in the diff
            # rather than a silent hole in this check.
            dupes="$(jq -r '(.meta.addressAliases // {} | keys) as $allowed
                            | [paths(scalars) as $p | select(($p | join(".")) as $k | $allowed | index($k) | not) | getpath($p)]
                            | map(select(type == "string" and test("^0x[0-9a-fA-F]{40}$")))
                            | map(ascii_downcase) | group_by(.) | map(select(length > 1)) | map(.[0]) | .[]' "$f")"
            if [ -n "$dupes" ]; then
              echo "::error file=$f::address appears under more than one key: $dupes"; fail=1
            fi

            # the fork pins here must match what the submodules are actually checked out at
            for r in infinity-core infinity-periphery infinity-universal-router; do
              pinned="$(jq -r --arg r "$r" '.meta.forkPins[$r]' "$f")"
              actual="$(git ls-tree HEAD "lib/$r" | awk '{print $3}')"
              if [ "$pinned" != "$actual" ]; then
                echo "::error file=$f::meta.forkPins.$r is $pinned but the submodule is at $actual"; fail=1
              fi
            done
          done
          exit $fail
